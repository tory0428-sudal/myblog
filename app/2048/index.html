<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>2048</h1>
      <p>같은 숫자 타일을 합쳐서 2048을 만들어보세요.</p>
    </header>

    <div class="top-bar">
      <div class="scoreboard">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">BEST</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <button type="button" class="new-game-btn" id="new-game-btn">새 게임</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="2048 게임 보드"></div>

      <div class="game-overlay hidden" id="game-overlay">
        <h2 id="overlay-title">Game Over</h2>
        <div class="overlay-actions">
          <button type="button" id="overlay-continue-btn" class="hidden">계속하기</button>
          <button type="button" id="overlay-restart-btn">다시 시작</button>
        </div>
      </div>
    </div>

    <p class="instructions">방향키(↑↓←→) 또는 화면을 스와이프해서 타일을 움직이세요.</p>
  </div>

  <script src="game.js"></script>
  <script src="input.js"></script>
  <script src="main.js"></script>
</body>
</html>
