<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토리의 기록</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="index.html">토리의 기록</a>
  <button class="theme-toggle" aria-label="테마 전환"></button>
</header>
<main>
  <a class="back-link" href="index.html">&larr; 목록으로</a>
  <article>
    <header class="post-header">
      <a id="post-category" class="post-category" href="index.html"></a>
      <h1 id="post-title" class="post-title"></h1>
      <div id="post-date" class="post-date"></div>
    </header>
    <div id="post-content" class="post-content"></div>
  </article>
  <nav class="post-nav" aria-label="글 탐색">
    <a id="post-nav-prev" class="post-nav-link post-nav-prev" hidden>
      <span class="post-nav-label">&larr; 이전글</span>
      <span class="post-nav-title"></span>
    </a>
    <a id="post-nav-next" class="post-nav-link post-nav-next" hidden>
      <span class="post-nav-label">다음글 &rarr;</span>
      <span class="post-nav-title"></span>
    </a>
  </nav>
  <a class="back-link post-list-link" href="index.html">목록 보기</a>
</main>
<script src="js/categories.js"></script>
<script src="js/post.js"></script>
</body>
</html>
